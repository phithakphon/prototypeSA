# Render Blueprint for the backend API (Node + Express). The frontend is deployed separately (Vercel / Netlify)
# and the database is Supabase. Nothing here deploys by itself: it only takes effect when you create the
# Blueprint in the Render dashboard. Secrets are never stored in this file (sync: false = you enter them there).
services:
  - type: web
    name: ems-backend
    runtime: node
    rootDir: backend
    branch: main
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY # Render puts one reverse proxy in front of the app
        value: "1"
      - key: DB_SSL
        value: verify
      - key: DB_POOL_MAX
        value: "5"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL # Supabase connection string (Session pooler)
        sync: false
      - key: DB_SSL_CA_PEM # Supabase Root CA, downloaded from the Supabase dashboard
        sync: false
      - key: CORS_ORIGINS # the exact frontend origin, e.g. https://your-app.vercel.app
        sync: false
